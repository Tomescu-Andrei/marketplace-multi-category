spring:
  application:
    name: marketplace-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/marketplace}
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace_local}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
      fail-on-trailing-tokens: true
    parser:
      strict-duplicate-detection: true

springdoc:
  paths-to-match: /api/v1/**
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
